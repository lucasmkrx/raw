name: Asset or documentation correction
description: Report an incorrect export, broken reference, or documentation issue.
title: "Correction: "
body:
  - type: input
    id: file
    attributes:
      label: Affected file
      placeholder: assets/favicon/favicon.svg
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem and expected result
      description: Include public-safe reproduction details and the viewer/browser if relevant.
    validations:
      required: true
